name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["reelgen/**", "tests/**", "publisher/**", "requirements.txt"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Offline end-to-end render (placeholder voice)
        run: python -m reelgen demo
